[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blackswan-three-task-framework"
version = "1.2.0"
description = "Multimodal training and T1/T2/T3 evaluation framework for BlackSwanNewsBench"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=14.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "lightgbm>=4.0",
]

[project.scripts]
blackswan-evaluate = "blackswan_tasks.cli:main"
blackswan-train = "blackswan_tasks.train_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
